name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: الاختبارات
        run: node tests/run.js
      - name: هل docs/API.md محدّث؟
        run: |
          node tools/gen-api.js
          git diff --exit-code docs/API.md || { echo "::error::شغّل node tools/gen-api.js وأضف docs/API.md إلى الالتزام"; exit 1; }
